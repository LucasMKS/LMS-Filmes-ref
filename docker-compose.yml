services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    networks:
      - lms-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lmsfilmes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 350M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    networks:
      - lms-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-lucasmks}/lms-filmes-ref:backend
    container_name: lms-filmes-backend
    restart: unless-stopped
    networks:
      lms-network:
        aliases:
          - lmsfilmes
          - lmsfavorite
          - lmsrating
          - gateway
          - lms-email
          - lms-backend
      proxy-network:
    ports:
      - "8080:8080"
      - "8081:8080"
      - "8082:8080"
      - "8083:8080"
      - "8084:8080"
    environment:
      - POSTGRES_URL=${POSTGRES_URL:-jdbc:postgresql://postgres:5432/lmsfilmes}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASS=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET}
      - TMDB_API_URL=${TMDB_API_URL:-https://api.themoviedb.org/3}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://filmes.lucasmks.com.br}
      - JAVA_TOOL_OPTIONS=-Xmx450m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 550M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-lucasmks}/lms-filmes-ref:frontend
    container_name: lms-filmes-frontend
    restart: unless-stopped
    networks:
      - lms-network
      - proxy-network
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 40M

networks:
  lms-network:
    driver: bridge
  proxy-network:
    external: true

volumes:
  postgres_data:
    name: lms_filmes_ref_postgres_data
  redis_data:
    name: lms_filmes_ref_redis_data
